plugins { id 'com.android.application' }

// API key is read from local.properties (NOT committed to Git). Without it only Open Library is used.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.personallibrary'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mybookshelf"
        minSdk 24; targetSdk 34
        versionCode 1; versionName "1.0"
        buildConfigField "String", "GOOGLE_BOOKS_API_KEY",
                "\"${localProps.getProperty('GOOGLE_BOOKS_API_KEY', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true   // needed for GOOGLE_BOOKS_API_KEY
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'   // sada se stvarno koristi u svim layoutima
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // [ISPRAVKA G1] uklonjeno: annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    //               (potreban samo ako postoji @GlideModule; bespotrebno usporava build)
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
